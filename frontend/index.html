<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desktop Image Organizer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px;
    }

    .card {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 600px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #f0f4ff;
      margin-bottom: 4px;
      letter-spacing: -0.01em;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #6b7280;
      margin-bottom: 32px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="text"] {
      width: 100%;
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 7px;
      padding: 10px 14px;
      font-size: 0.9rem;
      color: #e2e8f0;
      font-family: "SFMono-Regular", Consolas, monospace;
      transition: border-color 0.15s;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #4f6ef7;
    }

    input[type="text"]::placeholder {
      color: #3d4466;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .toggle-row label {
      margin: 0;
      text-transform: none;
      letter-spacing: normal;
      font-size: 0.9rem;
      color: #94a3b8;
      cursor: pointer;
    }

    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }

    .toggle input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      inset: 0;
      background: #2d3148;
      border-radius: 22px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      background: #6b7280;
      border-radius: 50%;
      left: 3px;
      top: 3px;
      transition: transform 0.2s, background 0.2s;
    }

    .toggle input:checked + .slider { background: #1e3a8a; }
    .toggle input:checked + .slider::before {
      transform: translateX(18px);
      background: #4f6ef7;
    }

    .divider {
      border: none;
      border-top: 1px solid #2d3148;
      margin: 24px 0;
    }

    details summary {
      font-size: 0.8rem;
      color: #6b7280;
      cursor: pointer;
      user-select: none;
      margin-bottom: 20px;
      list-style: none;
    }

    details summary::before {
      content: "▶  ";
      font-size: 0.65rem;
      transition: transform 0.2s;
    }

    details[open] summary::before { content: "▼  "; }

    button {
      width: 100%;
      padding: 12px;
      background: #4f6ef7;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    button:hover:not(:disabled) { background: #3b5bdb; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .result {
      margin-top: 24px;
      border-radius: 8px;
      padding: 16px 18px;
      font-size: 0.85rem;
      line-height: 1.6;
      display: none;
    }

    .result.success {
      display: block;
      background: #0d2b1a;
      border: 1px solid #1a4731;
      color: #6ee7b7;
    }

    .result.error {
      display: block;
      background: #2b0d0d;
      border: 1px solid #4b1a1a;
      color: #fca5a5;
    }

    .result pre {
      white-space: pre-wrap;
      word-break: break-word;
      font-family: "SFMono-Regular", Consolas, monospace;
    }

    .result .label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.6;
      margin-bottom: 6px;
    }

    .spinner {
      display: none;
      text-align: center;
      color: #4f6ef7;
      font-size: 0.85rem;
      margin-top: 16px;
    }

    .spinner.active { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Desktop Image Organizer</h1>
    <p class="subtitle">Move or copy PNG/JPEG images from a source directory to a destination.</p>

    <div class="field">
      <label for="source">Source Directory</label>
      <input type="text" id="source" placeholder="/path/to/source" autocomplete="off" spellcheck="false" />
    </div>

    <div class="field">
      <label for="dest">Destination Directory</label>
      <input type="text" id="dest" placeholder="/path/to/destination" autocomplete="off" spellcheck="false" />
    </div>

    <div class="toggle-row">
      <label class="toggle">
        <input type="checkbox" id="retainCopy" />
        <span class="slider"></span>
      </label>
      <label for="retainCopy">Retain copy in source directory</label>
    </div>

    <hr class="divider" />

    <details>
      <summary>Advanced — log file paths</summary>
      <div class="field">
        <label for="ignoredLog">Ignored Images Log</label>
        <input type="text" id="ignoredLog" placeholder="Leave blank to use config.yaml default" autocomplete="off" spellcheck="false" />
      </div>
      <div class="field">
        <label for="movedLog">Moved Images Log</label>
        <input type="text" id="movedLog" placeholder="Leave blank to use config.yaml default" autocomplete="off" spellcheck="false" />
      </div>
    </details>

    <button id="runBtn" onclick="runOrganize()">Run Organizer</button>

    <div class="spinner" id="spinner">Running&#8230;</div>

    <div class="result" id="result">
      <div class="label" id="resultLabel"></div>
      <pre id="resultText"></pre>
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:8000";

    async function runOrganize() {
      const source = document.getElementById("source").value.trim();
      const dest   = document.getElementById("dest").value.trim();

      if (!source || !dest) {
        showResult("error", "Error", "Source and destination directories are required.");
        return;
      }

      const body = {
        source_directory:      source,
        destination_directory: dest,
        retain_copy:           document.getElementById("retainCopy").checked,
      };

      const ignoredLog = document.getElementById("ignoredLog").value.trim();
      const movedLog   = document.getElementById("movedLog").value.trim();
      if (ignoredLog) body.ignored_log = ignoredLog;
      if (movedLog)   body.moved_log   = movedLog;

      setLoading(true);
      hideResult();

      try {
        const res = await fetch(`${API_BASE}/organize`, {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify(body),
        });

        const data = await res.json();

        if (!res.ok) {
          const msg = data.detail || JSON.stringify(data, null, 2);
          showResult("error", "Server Error", msg);
          return;
        }

        const summary = [
          `Source:      ${data.source_directory}`,
          `Destination: ${data.destination_directory}`,
          `Copy retained: ${data.retain_copy ? "Yes" : "No"}`,
          "",
          data.agent_summary,
        ].join("\n");

        showResult("success", "Complete", summary);

      } catch (err) {
        showResult("error", "Connection Error", `Could not reach the API at ${API_BASE}.\n\nMake sure the server is running:\n  bash script/bash/run_uv.sh`);
      } finally {
        setLoading(false);
      }
    }

    function setLoading(on) {
      document.getElementById("runBtn").disabled = on;
      document.getElementById("spinner").classList.toggle("active", on);
    }

    function showResult(type, label, text) {
      const el = document.getElementById("result");
      el.className = `result ${type}`;
      document.getElementById("resultLabel").textContent = label;
      document.getElementById("resultText").textContent  = text;
    }

    function hideResult() {
      document.getElementById("result").style.display = "none";
      document.getElementById("result").className = "result";
    }

    // Allow Enter key to submit
    document.addEventListener("keydown", e => {
      if (e.key === "Enter" && !document.getElementById("runBtn").disabled) runOrganize();
    });
  </script>
</body>
</html>
